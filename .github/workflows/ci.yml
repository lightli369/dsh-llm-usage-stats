name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate package.json
        run: node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if(!p.name||!p.exports||!p.dsh||p.dsh.client.platform!=='web') throw new Error('bad dsh.client declaration'); console.log('package.json OK')"
      - name: Syntax check host plugin
        run: node --check lib/index.js
      - name: Syntax check client bundle
        run: node --check lib/client.js
